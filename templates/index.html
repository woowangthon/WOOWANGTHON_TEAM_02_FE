{% extends "base.html" %}
{% block title %}알려줌 · 충북대학교 공지{% endblock %}
{% block content %}
  <section class="page-intro" aria-labelledby="page-title">
    <div>
      <p class="eyebrow">충북대학교 공지 모아보기</p>
      <h1 id="page-title">필요한 학교 공지를<br>한곳에서 확인하세요.</h1>
      <p class="intro-copy">학교 공식 게시판과 학과·학부 공지를 구분해 확인할 수 있습니다.</p>
    </div>
    <label class="search-field" for="notice-search">
      <span class="sr-only">공지 검색</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="notice-search" type="search" placeholder="제목, 내용, 담당 부서 검색" autocomplete="off">
    </label>
  </section>

  <section class="feed" aria-labelledby="feed-title">
    <div class="feed-heading">
      <div>
        <p class="eyebrow">내 학교 공지</p>
        <h2 id="feed-title">공지 모아보기</h2>
      </div>
      <p id="feed-status" class="feed-status" role="status" aria-live="polite">공지를 불러오는 중입니다.</p>
    </div>
    <div class="feed-toolbar">
      <div class="feed-tabs" role="tablist" aria-label="공지 목록 선택">
        <button class="feed-tab active" id="all-tab" type="button" role="tab" aria-selected="true" aria-controls="notice-list" tabindex="0" data-view="all" data-endpoint="/api/notices?per_page=20">전체 공지</button>
        <button class="feed-tab" id="recommended-tab" type="button" role="tab" aria-selected="false" aria-controls="notice-list" tabindex="-1" data-view="recommended" data-endpoint="/api/recommendations">맞춤 공지</button>
      </div>
      <a class="source-link" href="https://www.cbnu.ac.kr/www/selectBbsNttList.do?bbsNo=8&amp;key=814&amp;pageIndex=1&amp;searchCnd=all&amp;searchCtgry=" target="_blank" rel="noopener noreferrer">충북대 원문 게시판</a>
    </div>
    <div id="notice-list" class="notice-list" role="tabpanel" aria-labelledby="all-tab"></div>
  </section>
{% endblock %}
{% block scripts %}
  <script defer src="{{ url_for('static', path='/js/notices.js') }}"></script>
{% endblock %}
